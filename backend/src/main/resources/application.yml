spring:
  application:
    name: miseva
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:misva}
    username: ${DB_APP_USER:misva_app}
    password: ${DB_APP_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: filesystem:../database/migrations
    url: ${spring.datasource.url}
    user: ${DB_OWNER_USER:misva_owner}
    password: ${DB_OWNER_PASSWORD}
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
